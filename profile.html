    <main class="page-container">
        <div class="account-wrapper">
            <h1>Your Account | თქვენი აქაუნთი</h1>
            
            
            <form class="account-form" id="login-form">
                <input type="text" placeholder="Your Name" class="form-input" id="name-input" required>
                <input type="email" placeholder="Your Email" class="form-input" id="email-input" required>
               
                <input type="password" placeholder="Your Password" class="form-input" id="password-input" required>
                
                <button type="submit" class="form-btn primary">Log in | Sign up</button>
            </form>

          
                     
                        <div class="logged-in-view" id="logged-in-view" style="display: none;">
                <h2 id="welcome-message" style="color: #82c0eb;">Welcome! </h2>
                <p style="color: rgba(255,255,255,0.7); margin-bottom: 2rem;">You are successfully logged in.</p>
                <button class="form-btn secondary" id="logout-btn">Log Out</button>
            </div>
        </div>
    </main>
